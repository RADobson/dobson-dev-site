---
layout: default
---
<article class="post">
    <header class="post-header" style="margin-bottom: 2rem; padding-bottom: 1.5rem; border-bottom: 1px solid #1F2833;">
        <h1 style="font-size: 2.2rem; color: #FFFFFF; margin-bottom: 0.5rem; line-height: 1.3;">{{ page.title }}</h1>
        <div class="post-meta" style="color: #45A29E; font-size: 0.9rem; font-family: 'Fira Code', monospace;">
            <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
            {% if page.tags %}
            <span style="margin-left: 1rem;">
                {% for tag in page.tags %}
                <span style="background: #1F2833; padding: 2px 8px; border-radius: 4px; margin-left: 5px; color: #00F0FF;">#{{ tag }}</span>
                {% endfor %}
            </span>
            {% endif %}
        </div>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <footer class="post-footer" style="margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #1F2833;">
        <a href="/blog/" style="color: #00F0FF; font-family: 'Fira Code', monospace;">&larr; Back to all posts</a>
    </footer>
</article>
