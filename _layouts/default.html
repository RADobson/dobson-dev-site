<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    
    <!-- SEO: Canonical URL -->
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    
    <!-- SEO: Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1">
    <meta name="author" content="{{ site.author.name }}">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/assets/images/icon.svg">
    <link rel="apple-touch-icon" href="/assets/images/icon.svg">
    
    <!-- Performance: Resource Hints -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" as="style">
    
    <!-- PWA / Mobile -->
    <meta name="theme-color" content="#0B0C10">
    <meta name="color-scheme" content="dark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.webmanifest">
    
    <!-- Open Graph defaults -->
    <meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ page.image | default: '/assets/images/og-default.png' | absolute_url }}">
    <meta property="og:locale" content="en_AU">
    <meta property="og:site_name" content="{{ site.title }}">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@{{ site.twitter.username }}">
    <meta name="twitter:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta name="twitter:description" content="{{ page.description | default: site.description }}">
    <meta name="twitter:image" content="{{ page.image | default: '/assets/images/og-default.png' | absolute_url }}">

    <!-- SEO: Sitemap link -->
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml">
    
    <!-- Fonts — with display=swap to prevent FOIT -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0B0C10;
            --bg-secondary: #0f1014;
            --bg-card: #141419;
            --accent-neon: #00F0FF;
            --accent-purple: #BC13FE;
            --accent-green: #22c55e;
            --text-white: #FFFFFF;
            --text-grey: #9ca3af;
            --text-muted: #6b7280;
            --border-subtle: rgba(255, 255, 255, 0.06);
            --border-hover: rgba(0, 240, 255, 0.3);
            --font-mono: 'Fira Code', monospace;
            --font-body: 'Inter', sans-serif;
            --transition-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { 
            background: linear-gradient(180deg, var(--accent-neon), var(--accent-purple));
            border-radius: 3px;
        }

        html { scroll-behavior: smooth; }

        /* CLS FIX: System fonts until web fonts load */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-grey);
            line-height: 1.7;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .fonts-loaded body { font-family: var(--font-body); }
        .fonts-loaded h1, .fonts-loaded h2, .fonts-loaded h3, .fonts-loaded h4,
        .fonts-loaded code, .fonts-loaded .mono { font-family: var(--font-mono); }
        
        /* Reduced motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        h1, h2, h3, h4 { 
            color: var(--text-white); 
            font-family: var(--font-mono);
            letter-spacing: -0.5px;
            font-weight: 600;
        }

        a { 
            color: var(--accent-neon); 
            text-decoration: none; 
            transition: all 0.3s var(--transition-smooth);
        }

        code, pre, .mono { font-family: var(--font-mono); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .mono-accent { font-family: var(--font-mono); color: var(--accent-neon); }

        /* --- HEADER --- */
        .site-header {
            background: rgba(11, 12, 16, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.25rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-subtle);
        }

        .site-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-logo {
            font-family: var(--font-mono);
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-neon);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .site-logo::before {
            content: '>_';
            color: var(--accent-neon);
        }

        .site-logo:hover {
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
        }

        .site-nav {
            display: flex;
            gap: 2rem;
        }

        .site-nav a {
            color: var(--text-grey);
            font-size: 0.9rem;
            font-family: var(--font-mono);
            position: relative;
        }

        .site-nav a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-neon);
            transition: width 0.3s ease;
        }

        .site-nav a:hover {
            color: var(--accent-neon);
        }

        .site-nav a:hover::after {
            width: 100%;
        }

        /* --- MAIN CONTENT --- */
        main {
            padding: 3rem 0;
            min-height: calc(100vh - 200px);
        }

        /* --- FOOTER --- */
        .site-footer {
            padding: 2rem 0;
            border-top: 1px solid var(--border-subtle);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
        }

        .site-footer a {
            color: var(--text-grey);
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .site-footer a:hover {
            color: var(--accent-neon);
        }

        /* --- SCROLL REVEAL ANIMATIONS --- */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s var(--transition-smooth);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* --- BLOG SPECIFIC STYLES --- */
        .blog-header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .blog-header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 0.5rem;
        }

        .blog-header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .post-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 1.75rem;
            transition: all 0.4s var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .post-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s ease;
        }

        .post-card:hover::before {
            transform: scaleX(1);
        }

        .post-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -20px rgba(0, 0, 0, 0.5);
        }

        .post-card h2 {
            margin-bottom: 0.75rem;
            font-size: 1.35rem;
        }

        .post-card h2 a {
            color: var(--text-white);
            display: inline-block;
            position: relative;
        }

        .post-card h2 a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-neon);
            transition: width 0.3s ease;
        }

        .post-card h2 a:hover {
            color: var(--accent-neon);
        }

        .post-card h2 a:hover::after {
            width: 100%;
        }

        .post-meta {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: var(--font-mono);
            margin-bottom: 1rem;
        }

        .post-meta time {
            color: var(--accent-neon);
        }

        .post-tag {
            color: var(--accent-purple);
            font-size: 0.8rem;
        }

        .post-card p {
            color: var(--text-grey);
            margin-bottom: 1.25rem;
            line-height: 1.7;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .read-more .arrow {
            transition: transform 0.3s ease;
        }

        .read-more:hover .arrow {
            transform: translateX(4px);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        .empty-state p {
            font-family: var(--font-mono);
        }

        /* --- POST STYLES --- */
        .post-header {
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .post-header h1 {
            font-size: clamp(1.8rem, 4vw, 2.5rem);
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        .post-content h2, .post-content h3 {
            color: var(--text-white);
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }

        .post-content h2 {
            font-size: 1.5rem;
            color: var(--accent-neon);
        }

        .post-content h3 {
            font-size: 1.2rem;
        }

        .post-content p {
            margin-bottom: 1.5rem;
            color: var(--text-grey);
        }

        .post-content ul, .post-content ol {
            margin-bottom: 1.5rem;
            padding-left: 2rem;
        }

        .post-content li {
            margin-bottom: 0.5rem;
            color: var(--text-grey);
        }

        .post-content pre {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 1.25rem;
            overflow-x: auto;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .post-content code {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--accent-neon);
        }

        .post-content pre code {
            background: none;
            padding: 0;
            color: var(--text-grey);
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent-purple);
            padding-left: 1.25rem;
            margin: 2rem 0;
            color: var(--text-grey);
            font-style: italic;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .post-content th, .post-content td {
            border: 1px solid var(--border-subtle);
            padding: 12px 16px;
            text-align: left;
        }

        .post-content th {
            background: var(--bg-card);
            color: var(--accent-neon);
            font-weight: 600;
            font-family: var(--font-mono);
        }

        .post-content hr {
            border: none;
            border-top: 1px solid var(--border-subtle);
            margin: 2.5rem 0;
        }

        .post-content strong {
            color: var(--text-white);
            font-weight: 600;
        }

        .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1.5rem 0;
            border: 1px solid var(--border-subtle);
        }

        .post-content a {
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .post-content a:hover {
            color: var(--accent-purple);
        }

        /* Back link */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 2rem;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .back-link:hover {
            color: var(--accent-neon);
        }

        /* === PERFORMANCE: content-visibility for below-fold sections === */
        .post-list {
            content-visibility: auto;
            contain-intrinsic-size: auto 600px;
        }
        
        /* === ACCESSIBILITY: Enhanced focus states === */
        :focus-visible {
            outline: 2px solid var(--accent-neon);
            outline-offset: 3px;
        }
        
        :focus:not(:focus-visible) {
            outline: none;
        }
        
        .site-nav a:focus-visible,
        .read-more:focus-visible,
        .post-card h2 a:focus-visible {
            outline: 2px solid var(--accent-neon);
            outline-offset: 3px;
            border-radius: 4px;
        }

        /* --- MOBILE-FIRST RESPONSIVE --- */
        @media (max-width: 480px) {
            .container { padding: 0 16px; }
            .site-nav { gap: 1rem; }
            .site-nav a { font-size: 0.8rem; min-height: 44px; display: flex; align-items: center; }
            .post-card { padding: 1.25rem; }
        }
        
        @media (max-width: 768px) {
            .site-header .container {
                flex-direction: column;
                gap: 1rem;
            }

            .site-nav {
                gap: 1.5rem;
            }

            main {
                padding: 2rem 0;
            }

            .post-card {
                padding: 1.5rem;
            }

            .post-meta {
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            
            /* Safe area insets */
            .container {
                padding-left: max(20px, env(safe-area-inset-left, 0px));
                padding-right: max(20px, env(safe-area-inset-right, 0px));
            }
        }
        
        /* Touch devices: disable hover animations */
        @media (hover: none) {
            .post-card:hover { transform: none; }
        }
        
        /* Print styles */
        @media print {
            .site-header, .site-footer { display: none; }
            body { background: white; color: black; }
            a { color: #0066cc; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="site-logo">dobson.dev</a>
            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/blog/">Blog</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} Dobson Development Pty Ltd</p>
        </div>
    </footer>

    <!-- Font loading CLS fix -->
    <script>
    if ('fonts' in document) {
        Promise.all([
            document.fonts.load('400 1em Inter'),
            document.fonts.load('600 1em "Fira Code"')
        ]).then(function() {
            document.documentElement.classList.add('fonts-loaded');
        }).catch(function() {
            setTimeout(function() { document.documentElement.classList.add('fonts-loaded'); }, 3000);
        });
    } else {
        document.documentElement.classList.add('fonts-loaded');
    }
    </script>
    
    <script>
    (function() {
        'use strict';
        
        // Scroll reveal animation
        if ('IntersectionObserver' in window) {
            var revealObserver = new IntersectionObserver(function(entries) {
                entries.forEach(function(entry) {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.1, rootMargin: '0px 0px -50px 0px' });
            
            document.querySelectorAll('.reveal').forEach(function(el) {
                revealObserver.observe(el);
            });
        } else {
            document.querySelectorAll('.reveal').forEach(function(el) {
                el.classList.add('visible');
            });
        }

        // Smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(function(anchor) {
            anchor.addEventListener('click', function(e) {
                var target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    e.preventDefault();
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
        
        // Auto-add loading="lazy" to below-fold images
        document.querySelectorAll('.post-content img').forEach(function(img) {
            if (!img.hasAttribute('loading')) {
                img.setAttribute('loading', 'lazy');
                img.setAttribute('decoding', 'async');
            }
        });
        
        // Prefetch internal links on hover
        var prefetched = {};
        document.querySelectorAll('a[href^="/"]').forEach(function(link) {
            link.addEventListener('mouseenter', function() {
                var href = this.getAttribute('href');
                if (href && !prefetched[href]) {
                    var pf = document.createElement('link');
                    pf.rel = 'prefetch';
                    pf.href = href;
                    document.head.appendChild(pf);
                    prefetched[href] = true;
                }
            }, { once: true, passive: true });
        });
    })();
    </script>
</body>
</html>
