<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0B0C10;
            --bg-card: #1F2833;
            --text-primary: #C5C6C7;
            --text-bright: #FFFFFF;
            --accent-cyan: #00F0FF;
            --accent-purple: #BC13FE;
            --accent-green: #45A29E;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        code, pre, .mono {
            font-family: 'Fira Code', monospace;
        }

        a {
            color: var(--accent-cyan);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        a:hover {
            color: var(--accent-purple);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        .site-header {
            padding: 20px 0;
            border-bottom: 1px solid var(--bg-card);
        }

        .site-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .site-logo {
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .site-nav {
            display: flex;
            gap: 30px;
        }

        .site-nav a {
            color: var(--text-primary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .site-nav a:hover {
            color: var(--accent-cyan);
        }

        /* Main content */
        main {
            padding: 40px 0;
        }

        /* Footer */
        .site-footer {
            padding: 30px 0;
            border-top: 1px solid var(--bg-card);
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-primary);
        }

        .site-footer a {
            color: var(--accent-cyan);
        }

        /* Responsive */
        @media (max-width: 600px) {
            .site-header .container {
                flex-direction: column;
                gap: 15px;
            }

            .site-nav {
                gap: 20px;
            }
        }
    </style>
    {% if page.layout == 'post' %}
    <style>
        /* Post-specific styles */
        .post-content h1, .post-content h2, .post-content h3 {
            color: var(--text-bright);
            margin-top: 2rem;
            margin-bottom: 1rem;
        }

        .post-content h1 { font-size: 2rem; }
        .post-content h2 { font-size: 1.5rem; color: var(--accent-cyan); }
        .post-content h3 { font-size: 1.2rem; }

        .post-content p {
            margin-bottom: 1.2rem;
        }

        .post-content ul, .post-content ol {
            margin-bottom: 1.2rem;
            padding-left: 2rem;
        }

        .post-content li {
            margin-bottom: 0.5rem;
        }

        .post-content pre {
            background: var(--bg-card);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1.2rem;
            font-size: 0.9rem;
        }

        .post-content code {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
            color: var(--accent-cyan);
        }

        .post-content pre code {
            background: none;
            padding: 0;
            color: var(--text-primary);
        }

        .post-content blockquote {
            border-left: 3px solid var(--accent-purple);
            padding-left: 1rem;
            margin: 1.5rem 0;
            color: var(--text-primary);
            font-style: italic;
        }

        .post-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5rem;
        }

        .post-content th, .post-content td {
            border: 1px solid var(--bg-card);
            padding: 10px 15px;
            text-align: left;
        }

        .post-content th {
            background: var(--bg-card);
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .post-content hr {
            border: none;
            border-top: 1px solid var(--bg-card);
            margin: 2rem 0;
        }

        .post-content strong {
            color: var(--text-bright);
        }

        .post-content img {
            max-width: 100%;
            border-radius: 8px;
            margin: 1rem 0;
        }
    </style>
    {% endif %}
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="/" class="site-logo">&gt;_ dobson.dev</a>
            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/blog/">Blog</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {{ site.time | date: '%Y' }} Dobson Development. Built with Jekyll.</p>
        </div>
    </footer>
</body>
</html>
