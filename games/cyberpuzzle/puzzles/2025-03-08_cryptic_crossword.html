<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Hacker School 101</title>
  <!-- Ensure proper scaling on mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #333;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    /* Container allowing horizontal scrolling if needed */
    .crossword-container {
      width: 100%;
      overflow-x: auto;
      margin: 0 auto;
    }
    /* The puzzle table */
    table.crossword {
      border-collapse: collapse;
      margin: 20px auto 0 auto;
    }
    table.crossword td {
      border: 1px solid #888;
      width: 30px;
      /* Force square cells */
      aspect-ratio: 1;
      text-align: center;
      vertical-align: middle;
      font-family: monospace;
      font-size: 18px;
      position: relative;
      padding: 0;
      box-sizing: border-box;
    }
    /* Active cells (input fields) */
    .crossword input[type="text"] {
      margin: 2px;
      padding: 0;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      border: none;
      outline: none;
      text-align: center;
      font-size: 18px;
      font-family: monospace;
      background: #fff;
      color: #000;
      box-sizing: border-box;
      /* iOS fix */
      -webkit-text-fill-color: #000;
    }
    /* Inactive cells */
    .inactive {
      background: #000;
    }
    /* Clue number styling (small, bottom-left corner) */
    .clue-number {
      position: absolute;
      bottom: 1px;
      left: 1px;
      font-size: 10px;
      color: #000;
      pointer-events: none;
    }
    /* Celebration container centers the message in the viewport */
    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    /* Celebration message box */
    .celebration .message {
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 20px 40px;
      font-size: 24px;
      border: 2px solid #333;
      border-radius: 10px;
      opacity: 0;
      animation: fadeInOut 3s forwards;
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateY(-20px); }
      30%  { opacity: 1; transform: translateY(0); }
      70%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>
  <!-- <h1>Cryptic Crossword Shibboleth</h1> -->
  <!-- Crossword container -->
  <div class="crossword-container">
    <div id="crosswordGrid"></div>
  </div>
  <script>
    // Define grid boundaries: rows 0 to 12, columns 5 to 14.
    const rowStart = 0, rowEnd = 12;
    const colStart = 5, colEnd = 14;
    
    // Mapping of letters (keys: "row,col") for each word:
    const mapping = {
      // ADVANCED (row 8, columns 5–12)
      "8,5": "A",
      "8,6": "D",
      "8,7": "V",
      "8,8": "A",
      "8,9": "N",
      "8,10": "C",
      "8,11": "E",
      "8,12": "D",
      
      // PERSISTENT (vertical, column 9, rows 0–9)
      "0,9": "P",
      "1,9": "E",
      "2,9": "R",
      "3,9": "S",
      "4,9": "I",
      "5,9": "S",
      "6,9": "T",
      "7,9": "E",
      "8,9": "N",  // intersects ADVANCED at (8,9)
      "9,9": "T",
      
      // THREATS (vertical, column 5, rows 4–10)
      "4,5": "T",
      "5,5": "H",
      "6,5": "R",
      "7,5": "E",
      "8,5": "A",  // intersects ADVANCED at (8,5)
      "9,5": "T",
      "10,5": "S",
      
      // ZERO (across, row 1, columns 8–11)
      "1,8": "Z",
      "1,9": "E",  // intersects PERSISTENT (1,9)
      "1,10": "R",
      "1,11": "O",
      
      // DO (vertical, column 11, rows 0–1)
      "0,11": "D",
      "1,11": "O", // intersects ZERO at (1,11)
      
      // DAY (vertical, column 12, rows 8–10)
      "8,12": "D", // intersects ADVANCED at (8,12)
      "9,12": "A",
      "10,12": "Y",
      
      // ATTACKS (across, row 6, columns 8–14)
      "6,8": "A",
      "6,9": "T",  // intersects PERSISTENT (6,9)
      "6,10": "T",
      "6,11": "A",
      "6,12": "C",
      "6,13": "K",
      "6,14": "S"
    };
    
    // Clue numbers for starting cells:
    const clueNumbers = {
      "8,5": 1,    // ADVANCED starts at (8,5)
      "0,9": 2,    // PERSISTENT starts at (0,9)
      "4,5": 3,    // THREATS starts at (4,5)
      "1,8": 5,    // ZERO starts at (1,8)
      "0,11": 4,   // DO starts at (0,11)
      "8,12": 6,   // DAY starts at (8,12)
      "6,8": 7     // ATTACKS starts at (6,8)
    };
    
    // Build the crossword grid table.
    let htmlContent = '<table class="crossword">';
    for (let r = rowStart; r <= rowEnd; r++) {
      htmlContent += '<tr>';
      for (let c = colStart; c <= colEnd; c++) {
        const key = r + "," + c;
        if (mapping[key]) {
          htmlContent += `<td>
            <input type="text" maxlength="1"
              data-row="${r}"
              data-col="${c}"
              data-solution="${mapping[key]}"
            />`;
          if (clueNumbers[key]) {
            htmlContent += `<span class="clue-number">${clueNumbers[key]}</span>`;
          }
          htmlContent += `</td>`;
        } else {
          htmlContent += `<td class="inactive"></td>`;
        }
      }
      htmlContent += '</tr>';
    }
    htmlContent += '</table>';
    document.getElementById("crosswordGrid").innerHTML = htmlContent;
    
    // Set up navigation and logic.
    const inputs = document.querySelectorAll('.crossword input[type="text"]');
    const cellMap = new Map();
    inputs.forEach(inp => {
      const r = parseInt(inp.dataset.row, 10);
      const c = parseInt(inp.dataset.col, 10);
      cellMap.set(r + ',' + c, inp);
    });
    let solved = false;
    function checkCompletion() {
      if (solved) return;
      let allCorrect = true;
      inputs.forEach(inp => {
        if (inp.value.toUpperCase() !== inp.dataset.solution.toUpperCase()) {
          allCorrect = false;
        }
      });
      if (allCorrect) {
        solved = true;
        showCelebration();
      }
    }
    function showCelebration() {
      const celebrationContainer = document.createElement('div');
      celebrationContainer.className = 'celebration';
      const messageBox = document.createElement('div');
      messageBox.className = 'message';
      messageBox.textContent = 'Crossword Complete!';
      celebrationContainer.appendChild(messageBox);
      document.body.appendChild(celebrationContainer);
      setTimeout(() => celebrationContainer.remove(), 3000);
    }
    inputs.forEach((input, i) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1) {
          const r = parseInt(input.dataset.row, 10);
          const c = parseInt(input.dataset.col, 10);
          // Auto-advance: check right first, then below.
          const rightCell = cellMap.get(r + ',' + (c + 1));
          if (rightCell) {
            rightCell.focus();
          } else {
            const belowCell = cellMap.get((r + 1) + ',' + c);
            if (belowCell) belowCell.focus();
          }
          checkCompletion();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          const next = inputs[i + 1];
          if (next) next.focus();
          return;
        }
        if (e.key === 'Backspace') {
          e.preventDefault();
          if (input.value.length > 0) {
            input.value = "";
            return;
          } else {
            const r = parseInt(input.dataset.row, 10);
            const c = parseInt(input.dataset.col, 10);
            const leftCell = cellMap.get(r + ',' + (c - 1));
            if (leftCell) {
              leftCell.focus();
              leftCell.value = "";
              return;
            }
            const aboveCell = cellMap.get((r - 1) + ',' + c);
            if (aboveCell) {
              aboveCell.focus();
              aboveCell.value = "";
              return;
            }
          }
        }
        const r = parseInt(input.dataset.row, 10);
        const c = parseInt(input.dataset.col, 10);
        const moveFocus = (deltaR, deltaC) => {
          e.preventDefault();
          let newR = r + deltaR;
          let newC = c + deltaC;
          while (newR >= rowStart && newR <= rowEnd &&
                 newC >= colStart && newC <= colEnd) {
            if (cellMap.has(newR + ',' + newC)) {
              cellMap.get(newR + ',' + newC).focus();
              break;
            }
            newR += deltaR;
            newC += deltaC;
          }
        };
        switch (e.key) {
          case 'ArrowUp':
            moveFocus(-1, 0);
            break;
          case 'ArrowDown':
            moveFocus(1, 0);
            break;
          case 'ArrowLeft':
            moveFocus(0, -1);
            break;
          case 'ArrowRight':
            moveFocus(0, 1);
            break;
        }
      });
    });
  </script>
</body>
</html>
