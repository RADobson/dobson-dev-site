<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cryptic Crossword Shibboleth</title>
  <!-- Ensures mobile devices display the page at the proper scale -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #333; /* Dark gray background */
      color: #fff;       /* White text for contrast */
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      margin-bottom: 10px;
    }
    /* Container allowing horizontal scrolling */
    .crossword-container {
      width: 100%;
      overflow-x: auto;
      margin: 0 auto;
    }
    /* The puzzle table */
    table.crossword {
      border-collapse: collapse;
      margin: 20px auto 0 auto;
    }
    table.crossword td {
      border: 1px solid #888;
      width: 30px;
      /* Use aspect-ratio to force square cells */
      aspect-ratio: 1;
      text-align: center;
      vertical-align: middle;
      font-family: monospace;
      font-size: 18px;
      position: relative;
      padding: 0;
      box-sizing: border-box;
    }
    /* Active squares */
    .crossword input[type="text"] {
      margin: 2px;
      padding: 0;
      width: calc(100% - 4px);
      height: calc(100% - 4px);
      border: none;
      outline: none;
      text-align: center;
      font-size: 18px;
      font-family: monospace;
      background: #fff;
      color: #000;
      box-sizing: border-box;
      /* iOS text rendering fix */
      -webkit-text-fill-color: #000;
    }
    /* Inactive squares */
    .inactive {
      background: #000;
    }
    /* Clue number styling */
    .clue-number {
      position: absolute;
      bottom: 1px;
      left: 1px;
      font-size: 10px;
      color: #000;
      pointer-events: none;
    }
    /* Celebration container: covers entire viewport and centers its child */
    .celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    /* Celebration message box */
    .celebration .message {
      background: rgba(255,255,255,0.95);
      color: #333;
      padding: 20px 40px;
      font-size: 24px;
      border: 2px solid #333;
      border-radius: 10px;
      opacity: 0;
      animation: fadeInOut 3s forwards;
    }
    @keyframes fadeInOut {
      0%   { opacity: 0; transform: translateY(-20px); }
      30%  { opacity: 1; transform: translateY(0); }
      70%  { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(20px); }
    }
  </style>
</head>
<body>
  <h1>Cryptic Crossword Shibboleth</h1>
  <!-- Puzzle container -->
  <div class="crossword-container">
    <div id="crosswordGrid"></div>
  </div>
  <script>
    // ============== GRID & MAPPING CONFIG ==============
    const rowStart = 3, rowEnd = 10;
    const colStart = 3, colEnd = 21;
    const mapping = {
      "4,8": "N",
      "4,9": "A",
      "4,10": "U",
      "4,11": "G",
      "4,12": "H",
      "4,13": "T",
      "4,14": "Y",
      "4,12": "H", // Overlap: HACKERS
      "5,12": "A",
      "6,12": "C",
      "7,12": "K",
      "8,12": "E",
      "9,12": "R",
      "10,12": "S",
      "8,14": "U",
      "9,14": "S",
      "10,14": "E",
      "3,9": "L",
      "4,9": "A",
      "5,9": "P",
      "6,9": "T",
      "7,9": "O",
      "8,9": "P",
      "9,9": "S",
      "6,7": "B",
      "6,8": "U",
      "6,9": "T",
      "9,3": "W",
      "9,4": "I",
      "9,5": "N",
      "9,6": "D",
      "9,7": "O",
      "9,8": "W",
      "9,9": "S",
      "9,11": "C",
      "9,12": "R",
      "9,13": "A",
      "9,14": "S",
      "9,15": "H",
      "9,16": "E",
      "9,17": "S",
      "4,17": "A",
      "5,17": "L",
      "6,17": "W",
      "7,17": "A",
      "8,17": "Y",
      "9,17": "S",
      "7,17": "A",
      "7,18": "P",
      "7,19": "P",
      "7,20": "L",
      "7,21": "E"
    };
    const clueNumbers = {
      "4,8": 1,
      "4,12": 2,
      "8,14": 3,
      "7,17": 4,
      "3,9": 5,
      "6,7": 6,
      "9,3": 7,
      "4,17": 8,
      "9,11": 9
    };
    let htmlContent = '<table class="crossword">';
    for (let r = rowStart; r <= rowEnd; r++) {
      htmlContent += '<tr>';
      for (let c = colStart; c <= colEnd; c++) {
        const key = r + "," + c;
        if (mapping[key]) {
          htmlContent += `<td>
                    <input type="text" maxlength="1"
                      data-row="${r}"
                      data-col="${c}"
                      data-solution="${mapping[key]}"
                    />`;
          if (clueNumbers[key]) {
            htmlContent += `<span class="clue-number">${clueNumbers[key]}</span>`;
          }
          htmlContent += `</td>`;
        } else {
          htmlContent += `<td class="inactive"></td>`;
        }
      }
      htmlContent += '</tr>';
    }
    htmlContent += '</table>';
    document.getElementById("crosswordGrid").innerHTML = htmlContent;

    const inputs = document.querySelectorAll('.crossword input[type="text"]');
    const cellMap = new Map();
    inputs.forEach((inp) => {
      const r = parseInt(inp.dataset.row, 10);
      const c = parseInt(inp.dataset.col, 10);
      cellMap.set(r + ',' + c, inp);
    });
    let solved = false;
    function checkCompletion() {
      if (solved) return;
      let allCorrect = true;
      inputs.forEach((inp) => {
        if (inp.value.toUpperCase() !== inp.dataset.solution.toUpperCase()) {
          allCorrect = false;
        }
      });
      if (allCorrect) {
        solved = true;
        showCelebration();
      }
    }
    function showCelebration() {
      const celebrationContainer = document.createElement('div');
      celebrationContainer.className = 'celebration';
      const messageBox = document.createElement('div');
      messageBox.className = 'message';
      messageBox.textContent = 'Crossword Complete!';
      celebrationContainer.appendChild(messageBox);
      document.body.appendChild(celebrationContainer);
      setTimeout(() => {
        celebrationContainer.remove();
      }, 3000);
    }
    inputs.forEach((input, i) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1) {
          const r = parseInt(input.dataset.row, 10);
          const c = parseInt(input.dataset.col, 10);
          const rightCell = cellMap.get(r + ',' + (c + 1));
          if (rightCell) {
            rightCell.focus();
          } else {
            const belowCell = cellMap.get((r + 1) + ',' + c);
            if (belowCell) {
              belowCell.focus();
            }
          }
          checkCompletion();
        }
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.code === 'Space') {
          e.preventDefault();
          const next = inputs[i + 1];
          if (next) next.focus();
          return;
        }
        if (e.key === 'Backspace') {
          e.preventDefault();
          if (input.value.length > 0) {
            input.value = "";
            return;
          } else {
            const r = parseInt(input.dataset.row, 10);
            const c = parseInt(input.dataset.col, 10);
            const leftCell = cellMap.get(r + ',' + (c - 1));
            if (leftCell) {
              leftCell.focus();
              leftCell.value = "";
              return;
            }
            const aboveCell = cellMap.get((r - 1) + ',' + c);
            if (aboveCell) {
              aboveCell.focus();
              aboveCell.value = "";
              return;
            }
          }
        }
        const r = parseInt(input.dataset.row, 10);
        const c = parseInt(input.dataset.col, 10);
        const moveFocus = (deltaR, deltaC) => {
          e.preventDefault();
          let newR = r + deltaR;
          let newC = c + deltaC;
          while (newR >= rowStart && newR <= rowEnd &&
                 newC >= colStart && newC <= colEnd) {
            if (cellMap.has(newR + ',' + newC)) {
              cellMap.get(newR + ',' + newC).focus();
              break;
            }
            newR += deltaR;
            newC += deltaC;
          }
        };
        switch (e.key) {
          case 'ArrowUp':
            moveFocus(-1, 0);
            break;
          case 'ArrowDown':
            moveFocus(1, 0);
            break;
          case 'ArrowLeft':
            moveFocus(0, -1);
            break;
          case 'ArrowRight':
            moveFocus(0, 1);
            break;
        }
      });
    });
  </script>
</body>
</html>
