# Jekyll Configuration
title: Richard Dobson
description: Building autonomous AI agents for cybersecurity. Open source. On-prem. Published openly.
url: "https://dobsondevelopment.com.au"
baseurl: ""

# Author
author:
  name: Richard Dobson
  email: richard@dobsondevelopment.com.au
  bio: "Building autonomous AI agents for Essential Eight compliance. Cyber + AI, Sunshine Coast."
  avatar: /assets/images/richard.jpg
  github: RADobson
  linkedin: richard-dobson-au

# Build
markdown: kramdown
highlighter: rouge
theme: minima

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

permalink: /blog/:title/

collections:
  posts:
    output: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Richard Dobson"

exclude:
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - PERFORMANCE_BENCHMARK_REPORT.md
  - SEO_PERFORMANCE_STRATEGY.md
  - ".git"
  - ".gitignore"

social:
  name: Richard Dobson
  links:
    - https://github.com/RADobson
    - https://www.linkedin.com/in/richard-dobson-au

newsletter_form_url: https://formspree.io/f/xzznoayg

kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    block:
      line_numbers: true
