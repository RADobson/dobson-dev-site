# Jekyll Configuration for Dobson Development
title: Dobson Development
description: Australian software studio building practical tools for cybersecurity and business
url: "https://dobsondevelopment.com.au"
baseurl: ""

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude files from build
exclude:
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - IMPROVEMENTS_PLAN.md

# Permalinks
permalink: /blog/:title/

# Collections
collections:
  posts:
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
