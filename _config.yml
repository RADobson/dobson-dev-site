# Jekyll Configuration for Dobson Development
title: Dobson Development
tagline: Change your Outlook on IT
description: "Change your Outlook on IT. The Australian AI automation and business strategy agency for businesses that want better: Macs, Linux, Claude and tools you would choose."
lang: en_AU
timezone: Australia/Brisbane
url: "https://dobsondevelopment.com.au"
baseurl: ""

# Author information
author:
  name: Richard Dobson
  email: richard@dobsondevelopment.com.au
  bio: "Founder of Dobson Development, the agency that changes your Outlook on IT. SOC and SIEM engineer turned builder."
  avatar: /assets/images/richard.jpg
  twitter: RADobson
  github: RADobson
  linkedin: richard-dobson-au

# Build settings
markdown: kramdown
highlighter: rouge
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Permalinks
permalink: /blog/:title/

# Collections
collections:
  posts:
    output: true

# Default front matter
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Richard Dobson"
  - scope:
      path: ""
    values:
      image: /assets/images/og-default.png

# Exclude files from build
exclude:
  - README.md
  - CNAME
  - Gemfile
  - Gemfile.lock
  - IMPROVEMENTS_PLAN.md
  - SEO_PERFORMANCE_STRATEGY.md
  - PERFORMANCE_BENCHMARK_REPORT.md
  - ANALYTICS-SETUP.md
  - ".git"
  - ".gitignore"

# SEO Tag settings
twitter:
  username: RADobson
  card: summary_large_image

facebook:
  app_id: 
  publisher: 

social:
  name: Richard Dobson
  links:
    - https://github.com/RADobson
    - https://www.linkedin.com/in/richard-dobson-au

# Google Analytics (replace with your ID when ready)
google_analytics: 

# Newsletter signup form URL (Formspree)
newsletter_form_url: https://formspree.io/f/xzznoayg

# Comments (Giscus - GitHub Discussions)
giscus:
  repo: RADobson/dobson-dev-site
  repo_id: R_kgDOQoAeuQ
  category: Announcements
  category_id: DIC_kwDOQoAeuc4C3oQG
  mapping: pathname
  reactions_enabled: 1
  emit_metadata: 0
  theme: light
  lang: en
  crossorigin: anonymous

# Syntax highlighting settings
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1
