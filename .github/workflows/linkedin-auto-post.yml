name: Auto-post to LinkedIn

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check for new blog posts
        id: check
        run: |
          NEW_POSTS=$(git diff --name-only HEAD~1 HEAD -- '_posts/*.md' | head -1)
          if [ -z "$NEW_POSTS" ]; then
            echo "No new posts found"
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            echo "New post: $NEW_POSTS"
            echo "has_new=true" >> $GITHUB_OUTPUT
            echo "post_file=$NEW_POSTS" >> $GITHUB_OUTPUT
          fi

      - name: Post to LinkedIn
        if: steps.check.outputs.has_new == 'true'
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
        run: |
          POST_FILE="${{ steps.check.outputs.post_file }}"
          
          # Extract front matter
          TITLE=$(sed -n 's/^title: *"\?\([^"]*\)"\?$/\1/p' "$POST_FILE" | head -1)
          DESC=$(sed -n 's/^description: *"\?\([^"]*\)"\?$/\1/p' "$POST_FILE" | head -1)
          TAGS=$(sed -n 's/^tags: *\[\(.*\)\]$/\1/p' "$POST_FILE" | tr -d '"' | tr ',' '\n' | head -5 | sed 's/^ *//' | sed 's/ *$//' | sed 's/[- ]//g' | sed 's/^/#/' | tr '\n' ' ')
          
          # Build slug from filename
          SLUG=$(basename "$POST_FILE" .md | sed 's/^[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}-//')
          URL="https://dobsondevelopment.com.au/blog/${SLUG}/"
          
          # Build post text
          TEXT="${TITLE}

          ${DESC}

          ${TAGS}"
          
          # Clean up whitespace
          TEXT=$(echo "$TEXT" | sed 's/^          //')
          
          # Create JSON payload
          PAYLOAD=$(cat <<EOF
          {
            "author": "${LINKEDIN_PERSON_URN}",
            "lifecycleState": "PUBLISHED",
            "specificContent": {
              "com.linkedin.ugc.ShareContent": {
                "shareCommentary": { "text": $(echo "$TEXT" | jq -Rs .) },
                "shareMediaCategory": "ARTICLE",
                "media": [{
                  "status": "READY",
                  "originalUrl": "${URL}",
                  "title": { "text": $(echo "$TITLE" | jq -Rs .) },
                  "description": { "text": $(echo "$DESC" | jq -Rs .) }
                }]
              }
            },
            "visibility": {
              "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
            }
          }
          EOF
          )
          
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.linkedin.com/v2/ugcPosts \
            -H "Authorization: Bearer ${LINKEDIN_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -H "X-Restli-Protocol-Version: 2.0.0" \
            -d "$PAYLOAD")
          
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Posted to LinkedIn: $TITLE"
            echo "$BODY"
          else
            echo "❌ Failed ($HTTP_CODE): $BODY"
            exit 1
          fi
