# The setup: what a Dobson Development business runs on.

- where: "On the desk"
  what: "Mac"
  why: "Aluminium, glass and a screen you'll catch yourself admiring. The laptop people ask for by name."

- where: "Under the hood"
  what: "Linux"
  why: "The operating system the internet runs on. Fast, lean and entirely yours."

- where: "For the thinking"
  what: "Claude"
  why: "AI that writes, reasons and builds. With ChatGPT, Gemini, Grok and open models on the bench wherever they're the better fit."

- where: "For the busywork"
  what: "n8n"
  why: "Every repetitive job in the business, automated in a tool you own and can take anywhere."

- where: "Keeping watch"
  what: "Jamf and CrowdStrike"
  why: "Every machine set up, patched and protected from one place. You'll forget it's there."

- where: "In the corner"
  what: "A server of your own"
  why: "Built by hand in Queensland. Open models like DeepSeek, Qwen, Kimi and Hermes, running in your building, answering only to you."
