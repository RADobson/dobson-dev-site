<!-- Newsletter Signup -->
<div class="newsletter-section reveal">
    <div class="newsletter-content">
        <h3>Subscribe to the newsletter</h3>
        <p>Get the latest posts on AI, startups, and building things that matter. No spam, unsubscribe anytime.</p>
        
        <form action="{{ site.newsletter_form_url }}" method="POST" class="newsletter-form" id="newsletter-form">
            <div class="newsletter-input-group">
                <input 
                    type="email" 
                    name="email" 
                    placeholder="your@email.com" 
                    required 
                    aria-label="Email address"
                    class="newsletter-input"
                    id="newsletter-email"
                >
                <button type="submit" class="newsletter-button">
                    <span class="button-text">Subscribe</span>
                    <span class="button-loading" style="display: none;">...</span>
                </button>
            </div>
            <input type="hidden" name="_subject" value="New blog subscriber">
            <input type="hidden" name="_replyto" value="">
            <p class="newsletter-privacy">We respect your privacy. No spam, ever.</p>
        </form>
        
        <div id="newsletter-success" class="newsletter-message newsletter-success" style="display: none;">
            <svg viewBox="0 0 24 24" fill="currentColor" width="24" height="24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            <span>Thanks for subscribing! Check your inbox to confirm.</span>
        </div>
        
        <div id="newsletter-error" class="newsletter-message newsletter-error" style="display: none;">
            <span>Something went wrong. Please try again.</span>
        </div>
    </div>
</div>

<style>
.newsletter-section {
    margin-top: 4rem;
    padding: 2.5rem;
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.05), rgba(188, 19, 254, 0.05));
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    position: relative;
    overflow: hidden;
}

.newsletter-section::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent-neon), var(--accent-purple));
}

.newsletter-content h3 {
    font-size: 1.3rem;
    margin-bottom: 0.75rem;
    color: var(--text-white);
}

.newsletter-content > p {
    color: var(--text-muted);
    margin-bottom: 1.5rem;
    max-width: 500px;
}

.newsletter-form {
    max-width: 500px;
}

.newsletter-input-group {
    display: flex;
    gap: 0.75rem;
    flex-wrap: wrap;
}

.newsletter-input {
    flex: 1;
    min-width: 250px;
    padding: 0.875rem 1rem;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    color: var(--text-white);
    font-family: var(--font-mono);
    font-size: 0.9rem;
    transition: all 0.3s ease;
}

.newsletter-input:focus {
    outline: none;
    border-color: var(--accent-neon);
    box-shadow: 0 0 0 3px rgba(0, 240, 255, 0.1);
}

.newsletter-input::placeholder {
    color: var(--text-muted);
}

.newsletter-button {
    padding: 0.875rem 1.5rem;
    background: var(--accent-neon);
    color: var(--bg-main);
    border: none;
    border-radius: 8px;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.newsletter-button:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -5px rgba(0, 240, 255, 0.3);
}

.newsletter-button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.newsletter-privacy {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 0.75rem;
    font-family: var(--font-mono);
}

.newsletter-message {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem;
    border-radius: 8px;
    margin-top: 1rem;
    font-family: var(--font-mono);
    font-size: 0.9rem;
}

.newsletter-success {
    background: rgba(34, 197, 94, 0.1);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: var(--accent-green);
}

.newsletter-error {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ef4444;
}

@media (max-width: 480px) {
    .newsletter-section {
        padding: 1.5rem;
    }
    
    .newsletter-input {
        min-width: 100%;
    }
    
    .newsletter-button {
        width: 100%;
    }
}
</style>

<script>
document.getElementById('newsletter-form').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const form = this;
    const submitBtn = form.querySelector('.newsletter-button');
    const buttonText = submitBtn.querySelector('.button-text');
    const buttonLoading = submitBtn.querySelector('.button-loading');
    const successMsg = document.getElementById('newsletter-success');
    const errorMsg = document.getElementById('newsletter-error');
    
    // Hide previous messages
    successMsg.style.display = 'none';
    errorMsg.style.display = 'none';
    
    // Show loading state
    submitBtn.disabled = true;
    buttonText.style.display = 'none';
    buttonLoading.style.display = 'inline';
    
    try {
        const formData = new FormData(form);
        const response = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        });
        
        if (response.ok) {
            form.reset();
            successMsg.style.display = 'flex';
        } else {
            throw new Error('Form submission failed');
        }
    } catch (error) {
        errorMsg.style.display = 'flex';
    } finally {
        submitBtn.disabled = false;
        buttonText.style.display = 'inline';
        buttonLoading.style.display = 'none';
    }
});
</script>
