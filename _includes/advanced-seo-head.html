<!-- ============================================================
     ADVANCED SEO HEAD — Core Web Vitals & Structured Data
     Include this in <head> for comprehensive SEO coverage
     ============================================================ -->

<!-- === PERFORMANCE: Resource Hints === -->
<link rel="dns-prefetch" href="https://fonts.googleapis.com">
<link rel="dns-prefetch" href="https://fonts.gstatic.com">
<link rel="dns-prefetch" href="https://formspree.io">
<link rel="dns-prefetch" href="https://giscus.app">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- === PERFORMANCE: Preload Critical Fonts === -->
<!-- Preload only the weights we actually use above the fold -->
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Fira+Code:wght@400;600&display=swap" as="style">

<!-- === SEO: Core Meta Tags === -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1">
<meta name="bingbot" content="index, follow">

<!-- === SEO: Geo-targeting for Australian business === -->
<meta name="geo.region" content="AU">
<meta name="geo.placename" content="Australia">
<meta name="geo.position" content="-26.6500;153.0667">
<meta name="ICBM" content="-26.6500, 153.0667">
<meta name="language" content="en-AU">

<!-- === PWA / Mobile: Theme & Manifest === -->
<meta name="theme-color" content="#0B0C10" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#0B0C10">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dobson Dev">
<meta name="application-name" content="Dobson Development">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">

<!-- === SEO: Structured Data — WebSite with SearchAction === -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title | default: 'Dobson Development' }}",
    "alternateName": "Dobson Dev",
    "url": "{{ site.url }}",
    "description": "{{ site.description }}",
    "publisher": {
        "@type": "Organization",
        "name": "Dobson Development Pty Ltd",
        "url": "{{ site.url }}"
    },
    "inLanguage": "en-AU",
    "potentialAction": {
        "@type": "SearchAction",
        "target": {
            "@type": "EntryPoint",
            "urlTemplate": "{{ site.url }}/blog/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
    }
}
</script>
