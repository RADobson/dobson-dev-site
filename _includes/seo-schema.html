<!-- ============================================================
     Structured Data / JSON-LD for SEO
     Enhanced with proper schema types and relationships
     ============================================================ -->
{% if page.layout == 'post' %}
<!-- BlogPosting Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": {{ page.title | jsonify }},
    "description": {{ page.excerpt | strip_html | truncatewords: 30 | jsonify }},
    "image": {
        "@type": "ImageObject",
        "url": {{ page.image | default: '/assets/images/og-default.png' | absolute_url | jsonify }}
    },
    "url": {{ page.url | absolute_url | jsonify }},
    "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
    "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
    "author": {
        "@type": "Person",
        "name": {{ page.author | default: site.author.name | jsonify }},
        "url": {{ site.url | jsonify }},
        "email": {{ site.author.email | jsonify }},
        "sameAs": [
            "https://github.com/{{ site.author.github }}",
            "https://www.linkedin.com/in/{{ site.author.linkedin }}",
            "https://twitter.com/{{ site.author.twitter }}"
        ]
    },
    "publisher": {
        "@type": "Organization",
        "name": {{ site.title | jsonify }},
        "url": {{ site.url | jsonify }},
        "logo": {
            "@type": "ImageObject",
            "url": {{ '/assets/images/logo.png' | absolute_url | jsonify }},
            "width": 512,
            "height": 512
        }
    },
    "mainEntityOfPage": {
        "@type": "WebPage",
        "@id": {{ page.url | absolute_url | jsonify }}
    },
    {% if page.tags %}
    "keywords": {{ page.tags | join: ', ' | jsonify }},
    {% endif %}
    "articleSection": "Technology",
    "inLanguage": "en-AU",
    {% assign words = page.content | number_of_words %}
    "wordCount": {{ words }},
    "timeRequired": "PT{% if words < 360 %}1{% else %}{{ words | divided_by: 180 }}{% endif %}M"
}
</script>

<!-- Article meta for news aggregators -->
<meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
<meta property="article:modified_time" content="{{ page.last_modified_at | default: page.date | date_to_xmlschema }}">
<meta property="article:author" content="{{ site.url }}">
<meta property="article:section" content="Technology">
{% for tag in page.tags %}
<meta property="article:tag" content="{{ tag }}">
{% endfor %}

{% else %}
<!-- Blog Schema -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "Blog",
    "name": {{ site.title | append: ' Blog' | jsonify }},
    "description": {{ site.description | jsonify }},
    "url": {{ '/blog/' | absolute_url | jsonify }},
    "inLanguage": "en-AU",
    "publisher": {
        "@type": "Organization",
        "name": {{ site.title | jsonify }},
        "url": {{ site.url | jsonify }},
        "logo": {
            "@type": "ImageObject",
            "url": {{ '/assets/images/logo.png' | absolute_url | jsonify }}
        }
    },
    "blogPost": [
        {% for post in site.posts limit: 10 %}
        {
            "@type": "BlogPosting",
            "headline": {{ post.title | jsonify }},
            "url": {{ post.url | absolute_url | jsonify }},
            "datePublished": {{ post.date | date_to_xmlschema | jsonify }},
            "author": {
                "@type": "Person",
                "name": {{ post.author | default: site.author.name | jsonify }}
            }
        }{% unless forloop.last %},{% endunless %}
        {% endfor %}
    ]
}
</script>
{% endif %}

<!-- Breadcrumb structured data (all pages) -->
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "BreadcrumbList",
    "itemListElement": [
        {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": {{ site.url | jsonify }}
        },
        {
            "@type": "ListItem",
            "position": 2,
            "name": "Blog",
            "item": {{ '/blog/' | absolute_url | jsonify }}
        }
        {% if page.layout == 'post' %}
        ,{
            "@type": "ListItem",
            "position": 3,
            "name": {{ page.title | jsonify }},
            "item": {{ page.url | absolute_url | jsonify }}
        }
        {% endif %}
    ]
}
</script>
