<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B0C10"/>
      <stop offset="100%" style="stop-color:#141419"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F0FF"/>
      <stop offset="100%" style="stop-color:#BC13FE"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle grid pattern -->
  <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(0,240,255,0.03)" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  
  <!-- Accent line -->
  <rect x="60" y="530" width="200" height="4" fill="url(#accentGrad)" rx="2"/>
  
  <!-- Logo prompt -->
  <text x="60" y="120" font-family="monospace" font-size="36" fill="#00F0FF" font-weight="bold">&gt;_ dobson_dev_</text>
  
  <!-- Main text -->
  <text x="60" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" fill="#FFFFFF" font-weight="600">Building software</text>
  <text x="60" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="72" fill="#BC13FE" font-weight="600">that ships.</text>
  
  <!-- Tagline -->
  <text x="60" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#9ca3af">Australian software studio • Cybersecurity • SaaS • AI</text>
  
  <!-- URL -->
  <text x="60" y="580" font-family="monospace" font-size="24" fill="#6b7280">dobsondevelopment.com.au</text>
</svg>
